[build]
  command = "npm run build"
  publish = "dist/memory-app/browser"

[build.environment]
  NODE_VERSION = "22"

# Archivos de la PWA: siempre revalidar para que las actualizaciones lleguen al teléfono.
[[headers]]
  for = "/ngsw-worker.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/ngsw.json"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
